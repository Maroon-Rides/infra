---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-ingress
  namespace: networking
  annotations:
    # The Gateway's own address is the envoy ClusterIP, not the public IP.
    external-dns.kubernetes.io/target: ${PUBLIC_IPV4}
spec:
  gatewayClassName: envoy-ingress
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: maroonrides-app-tls
