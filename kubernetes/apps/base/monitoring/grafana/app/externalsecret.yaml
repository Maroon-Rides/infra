---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-admin
    template:
      data:
        admin-user: admin
        admin-password: '{{ .admin_password }}'
  dataFrom:
    - extract:
        key: grafana
