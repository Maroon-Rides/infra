---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ocirepository.yaml
  - externalsecret.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/maroonrides-api.json
      - dashboards/maroonrides-auth.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: '1'
