---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/base/monitoring/grafana/app
  targetNamespace: monitoring
  dependsOn:
    - name: onepassword
      namespace: secrets
    - name: miroir-config
      namespace: storage
