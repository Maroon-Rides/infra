---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-discord
    template:
      data:
        webhook-url: '{{ .webhook_url }}'
  dataFrom:
    - extract:
        key: discord-alerts
