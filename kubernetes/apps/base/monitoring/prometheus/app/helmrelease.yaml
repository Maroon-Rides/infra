---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: prometheus
  values:
    kube-state-metrics:
      enabled: false
    prometheus-node-exporter:
      enabled: false
    prometheus-pushgateway:
      enabled: false

    # Only pods annotated with prometheus.io/scrape are scraped.
    scrapeConfigs:
      kubernetes-service-endpoints:
        enabled: false
      kubernetes-service-endpoints-slow:
        enabled: false
      prometheus-pushgateway:
        enabled: false
      kubernetes-services:
        enabled: false

    server:
      retention: 15d
      retentionSize: 8GB
      persistentVolume:
        storageClass: miroir
        size: 10Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi

    alertmanager:
      persistence:
        storageClass: miroir
      extraSecretMounts:
        - name: discord
          mountPath: /etc/alertmanager/discord
          secretName: alertmanager-discord
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      config:
        route:
          receiver: discord
          group_by: [alertname, job, upstream]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
        receivers:
          - name: discord
            discord_configs:
              - webhook_url_file: /etc/alertmanager/discord/webhook-url
                send_resolved: true

    serverFiles:
      alerting_rules.yml:
        groups:
          - name: maroonrides-api
            rules:
              - alert: ApiTargetDown
                expr: up{namespace="maroonrides"} == 0
                for: 5m
                annotations:
                  summary: '{{ $labels.pod }} has not been scraped for 5 minutes'

              - alert: GatewayHighErrorRate
                expr: |
                  sum(rate(gateway_http_requests_total{status=~"5.."}[5m]))
                    / sum(rate(gateway_http_requests_total[5m])) > 0.05
                  and sum(rate(gateway_http_requests_total[5m])) > 0.1
                for: 5m
                annotations:
                  summary: 'Gateway is failing {{ $value | humanizePercentage }} of requests'

              - alert: UpstreamHighFailureRate
                expr: |
                  sum by (upstream) (rate(requester_upstream_requests_total{status=~"5..|error"}[5m]))
                    / sum by (upstream) (rate(requester_upstream_requests_total[5m])) > 0.2
                for: 10m
                annotations:
                  summary: '{{ $labels.upstream }} is failing {{ $value | humanizePercentage }} of requests'

              - alert: RequesterJobRetriesExhausted
                expr: sum by (job) (increase(requester_job_retries_exhausted_total[15m])) > 0
                annotations:
                  summary: 'Job {{ $labels.job }} ran out of retries {{ $value | humanize }} times in 15 minutes'
